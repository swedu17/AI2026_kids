<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전국 어린이보호구역 탐색 지도</title>
  <meta name="description" content="전국 어린이보호구역 현황, 시설종류 및 CCTV 설치여부를 한눈에 조회하고 필터링하는 웹 애플리케이션">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-child-reaching"></i>
          </div>
          <div>
            <h1>어린이보호구역 지도</h1>
            <span class="subtitle">전국 표준 데이터 탐색기</span>
          </div>
        </div>
        <button id="sidebarCloseBtn" class="mobile-close-btn" aria-label="사이드바 닫기">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="sidebar-body">
        <!-- Dashboard Quick Stats -->
        <section class="stats-section">
          <h2 class="section-title"><i class="fa-solid fa-chart-pie"></i> 구역 현황 요약</h2>
          <div class="stats-grid">
            <div class="stat-card total">
              <span class="stat-label">총 보호구역</span>
              <span class="stat-value" id="statTotal">0</span>
              <span class="stat-sub">조회된 지점</span>
            </div>
            <div class="stat-card installed">
              <span class="stat-label">CCTV 설치 (파랑)</span>
              <span class="stat-value" id="statInstalled">0</span>
              <span class="stat-sub" id="statInstalledPct">0%</span>
            </div>
            <div class="stat-card uninstalled">
              <span class="stat-label">CCTV 미설치 (빨강)</span>
              <span class="stat-value" id="statUninstalled">0</span>
              <span class="stat-sub" id="statUninstalledPct">0%</span>
            </div>
          </div>
        </section>

        <!-- Search Bar -->
        <section class="filter-section">
          <h2 class="section-title"><i class="fa-solid fa-magnifying-glass"></i> 검색</h2>
          <div class="search-box">
            <i class="fa-solid fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="시설명 또는 주소 검색 (예: 초등학교, 이천시)" autocomplete="off">
            <button id="searchClearBtn" class="clear-btn hidden" aria-label="검색어 지우기">
              <i class="fa-solid fa-circle-xmark"></i>
            </button>
          </div>
        </section>

        <!-- CCTV Status Filter -->
        <section class="filter-section">
          <h2 class="section-title"><i class="fa-solid fa-video"></i> CCTV 설치여부 필터</h2>
          <div class="cctv-filter-group">
            <button class="cctv-btn active" data-cctv="all">
              <span class="badge-dot all"></span> 전체보기
            </button>
            <button class="cctv-btn blue" data-cctv="Y">
              <span class="badge-dot blue"></span> 설치 (파랑)
            </button>
            <button class="cctv-btn red" data-cctv="N">
              <span class="badge-dot red"></span> 미설치 (빨강)
            </button>
          </div>
        </section>

        <!-- Facility Type Filter -->
        <section class="filter-section">
          <div class="section-header">
            <h2 class="section-title"><i class="fa-solid fa-school"></i> 시설종류 필터</h2>
            <button id="selectAllTypesBtn" class="text-btn">전체선택</button>
          </div>
          <div class="facility-type-list" id="facilityTypeList">
            <!-- Dynamic Checkboxes populated by app.js -->
            <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> 로딩 중...</div>
          </div>
        </section>

        <!-- Reset Button -->
        <div class="action-area">
          <button id="resetFiltersBtn" class="reset-btn">
            <i class="fa-solid fa-rotate-left"></i> 필터 초기화
          </button>
        </div>
      </div>

      <!-- Footer Info -->
      <footer class="sidebar-footer">
        <p><i class="fa-solid fa-database"></i> 행정안전부 전국어린이보호구역표준데이터</p>
        <p class="copyright">© 2026 Kids Safety Map</p>
      </footer>
    </aside>

    <!-- Map Main Content Area -->
    <main class="map-wrapper">
      <!-- Top Floating Control Bar -->
      <div class="floating-header">
        <button id="sidebarToggleBtn" class="sidebar-toggle-btn" aria-label="사이드바 토글">
          <i class="fa-solid fa-bars"></i>
          <span>필터 메뉴</span>
        </button>

        <div class="legend-bar">
          <div class="legend-item">
            <span class="legend-pin blue"></span>
            <span>CCTV 설치 (파란색)</span>
          </div>
          <div class="legend-item">
            <span class="legend-pin red"></span>
            <span>CCTV 미설치 (빨간색)</span>
          </div>
        </div>
      </div>

      <!-- Leaflet Map Container -->
      <div id="map"></div>

      <!-- Quick Location Controls -->
      <div class="map-controls">
        <button id="recenterBtn" title="대한민국 전체보기" class="map-control-btn">
          <i class="fa-solid fa-location-crosshairs"></i>
        </button>
      </div>
    </main>
  </div>

  <!-- Data Script -->
  <script src="data.js"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Leaflet MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Main App Logic -->
  <script src="app.js"></script>
</body>
</html>
